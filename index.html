<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dikshit Arcade</title>
    <style>
        body {
            margin: 0;
            background-color: #121824;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 220px;
            background-color: #1a2332;
            border-right: 2px solid #2a3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            background-color: #27ae60;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.4);
        }
        .nav-link {
            width: 100%;
            background: #222e42;
            color: #d1d5db;
            border: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #27ae60;
            color: white;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }
        h1 { margin-top: 0; color: #f39c12; }
        
        /* Game Container */
        .game-container {
            background: #1f293d;
            border: 2px solid #374151;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #0b0f19;
            border: 2px solid #27ae60;
            border-radius: 8px;
            display: block;
            margin: 15px auto;
        }
        .score-board {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🎮 DIKSHIT ARCADE</div>
        <button class="nav-link active">🏠 Home</button>
        <button class="nav-link">🔥 Hot Games</button>
        <button class="nav-link">⭐ Favorites</button>
    </div>

    <div class="main-content">
        <h1>Playable Game Zone</h1>
        
        <div class="game-container">
            <h3>🐍 Steal Brainrot - Mini Arena</h3>
            <div class="score-board">Score: <span id="score">0</span></div>
            <!-- The actual playable game canvas -->
            <p style="font-size: 13px; color: #9ca3af; margin-top:0;">Use <b>Left / Right Arrow Keys</b> to catch the floating memes!</p>
            <canvas id="gameCanvas" width="500" height="350"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        
        // Player object (the basket/character)
        let player = {
            x: 210,
            y: 300,
            width: 80,
            height: 20,
            color: "#e74c3c",
            speed: 8
        };

        // Item to catch
        let item = {
            x: Math.random() * 460,
            y: 0,
            width: 30,
            height: 30,
            speed: 3,
            color: "#f39c12"
        };

        let keys = {};

        // Listen for keyboard inputs
        window.addEventListener("keydown", function(e) { keys[e.key] = true; });
        window.addEventListener("keyup", function(e) { keys[e.key] = false; });

        function update() {
            // Move player
            if (keys["ArrowLeft"] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Move item down
            item.y += item.speed;

            // Check if item hits the bottom
            if (item.y > canvas.height) {
                resetItem();
            }

            // Check for collision with player
            if (
                item.x < player.x + player.width &&
                item.x + item.width > player.x &&
                item.y + item.height > player.y &&
                item.y < player.y + player.height
            ) {
                score += 10;
                document.getElementById("score").innerText = score;
                item.speed += 0.2; // Gets faster as you score more!
                resetItem();
            }
        }

        function resetItem() {
            item.y = 0;
            item.x = Math.random() * (canvas.width - item.width);
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw falling item
            ctx.fillStyle = item.color;
            ctx.fillRect(item.x, item.y, item.width, item.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start game loop
        loop();
    </script>

</body>
</html>
