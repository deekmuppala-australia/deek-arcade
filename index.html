<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEK ARCADE</title>
    <style>
        body {
            margin: 0;
            background-color: #121824;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #1a2332;
            border-right: 2px solid #2a3748;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .logo {
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        .nav-section {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            margin: 15px 0 5px 5px;
            letter-spacing: 1px;
        }
        .nav-btn {
            background: #222e42;
            color: #d1d5db;
            border: none;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { background: #27ae60; color: white; }

        /* Main Area */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            position: relative;
            padding: 20px;
        }

        /* Home View Grid of Game Cards */
        #homeView {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
            overflow-y: auto;
        }
        .games-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 850px;
        }
        .game-card {
            background: #1f293d;
            border: 2px solid #374151;
            width: 190px;
            height: 150px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            padding: 10px;
        }
        .game-card:hover {
            border-color: #27ae60;
            transform: scale(1.05);
            background: #25334d;
        }

        /* Play View Container */
        #playView {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .back-btn {
            align-self: flex-start;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .back-btn:hover { background: #c0392b; }
        
        iframe {
            width: 100%;
            height: 85%;
            border: 2px solid #374151;
            border-radius: 10px;
            background: #000;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">🎮 DEEK ARCADE</div>
        
        <div class="nav-section">Navigation</div>
        <button class="nav-btn active" onclick="showHome()">🏠 Home</button>

        <div class="nav-section">Hot Games</div>
        <button class="nav-btn" onclick="openGame('Space Waves', 'https://www.crazygames.com/embed/space-waves')">🌌 Space Waves</button>
        <button class="nav-btn" onclick="openGame('Lucky Block', 'https://playgama.com/game/kick-lucky-blocks-online?utm_source=bing&utm_medium=cpc&utm_campaign=Bing_DSA-category_T1_eng_Desktop_General&utm_campaign_id=523447623&utm_adgroup=game&utm_adgroup_id=1319416968654326&utm_term=game&utm_content=cid-523447623|gid-1319416968654326|aid-82463811984225|net-o|dvc-c&utm_target=dat-2334263187200558:loc-9&utm_network=o&utm_device=c&msclkid=262b719a3c7a11f980611b06872b5f95')">🎁 Lucky Block</button>
        <button class="nav-btn" onclick="openGame('Steal Brainrots', 'https://duckmath.org/class/steal-brainrots-multiplayer')">🐍 Steal Brainrots</button>
        <button class="nav-btn" onclick="openGame('Emperors on Ice', 'https://html5.gamedistribution.com/12d36b63ef9641e685adc28bd3e28999/')">🐧 Emperors on Ice</button>
        <button class="nav-btn" onclick="openGame('Micro Pilots', 'https://html5.gamedistribution.com/2c28e9be86334bc7b1299a1a18a3f8e9/')">🚁 Micro Pilots</button>
        <button class="nav-btn" onclick="openGame('Panda Block', 'https://www.bubbleshooter.net/games/panda-block/')">🐼 Panda Block</button>
    </div>

    <!-- Main View Area -->
    <div class="main">
        
        <!-- Home View with Clickable Game Cards -->
        <div id="homeView">
            <h1 style="color: #f39c12; margin-bottom: 30px;">🔥 Select a Game to Play</h1>
            <div class="games-grid">
                <div class="game-card" onclick="openGame('Space Waves', 'https://www.crazygames.com/embed/space-waves')">
                    <span style="font-size: 35px;">🌌</span>
                    <h4 style="margin: 10px 0 0 0;">Space Waves</h4>
                </div>
                <div class="game-card" onclick="openGame('Lucky Block', 'https://playgama.com/game/kick-lucky-blocks-online?utm_source=bing&utm_medium=cpc&utm_campaign=Bing_DSA-category_T1_eng_Desktop_General&utm_campaign_id=523447623&utm_adgroup=game&utm_adgroup_id=1319416968654326&utm_term=game&utm_content=cid-523447623|gid-1319416968654326|aid-82463811984225|net-o|dvc-c&utm_target=dat-2334263187200558:loc-9&utm_network=o&utm_device=c&msclkid=262b719a3c7a11f980611b06872b5f95')">
                    <span style="font-size: 35px;">🎁</span>
                    <h4 style="margin: 10px 0 0 0;">Lucky Block</h4>
                </div>
                <div class="game-card" onclick="openGame('Steal Brainrots', 'https://duckmath.org/class/steal-brainrots-multiplayer')">
                    <span style="font-size: 35px;">🐍</span>
                    <h4 style="margin: 10px 0 0 0;">Steal Brainrots</h4>
                </div>
                <div class="game-card" onclick="openGame('Emperors on Ice', 'https://html5.gamedistribution.com/12d36b63ef9641e685adc28bd3e28999/')">
                    <span style="font-size: 35px;">🐧</span>
                    <h4 style="margin: 10px 0 0 0;">Emperors on Ice</h4>
                </div>
                <div class="game-card" onclick="openGame('Micro Pilots', 'https://html5.gamedistribution.com/2c28e9be86334bc7b1299a1a18a3f8e9/')">
                    <span style="font-size: 35px;">🚁</span>
                    <h4 style="margin: 10px 0 0 0;">Micro Pilots</h4>
                </div>
                <div class="game-card" onclick="openGame('Panda Block', 'https://www.bubbleshooter.net/games/panda-block/')">
                    <span style="font-size: 35px;">🐼</span>
                    <h4 style="margin: 10px 0 0 0;">Panda Block</h4>
                </div>
            </div>
        </div>

        <!-- Active Game Play View -->
        <div id="playView">
            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                <button class="back-btn" onclick="showHome()">⬅ Back to Home</button>
                <h2 id="gameTitle" style="margin: 0 0 15px 0; color: #2ecc71;">Game Title</h2>
                <div style="width: 100px;"></div>
            </div>
            <iframe id="gameFrame" src=""></iframe>
        </div>

    </div>

    <script>
        function openGame(title, url) {
            document.getElementById("homeView").style.display = "none";
            document.getElementById("playView").style.display = "flex";
            document.getElementById("gameTitle").innerText = title;
            document.getElementById("gameFrame").src = url;
        }

        function showHome() {
            document.getElementById("playView").style.display = "none";
            document.getElementById("homeView").style.display = "flex";
            document.getElementById("gameFrame").src = ""; 
        }
    </script>

</body>
</html>
