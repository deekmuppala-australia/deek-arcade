<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEK ARCADE</title>
    <style>
        body {
            margin: 0;
            background-color: #121824;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #1a2332;
            border-right: 2px solid #2a3748;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .logo {
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        .nav-section {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            margin: 15px 0 5px 5px;
            letter-spacing: 1px;
        }
        .nav-btn {
            background: #222e42;
            color: #d1d5db;
            border: none;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }
        .nav-btn:hover, .nav-btn.active { background: #27ae60; color: white; }

        /* Secret Admin & Ban Panel */
        #adminPanel {
            display: none;
            background: #111827;
            border: 2px solid #e74c3c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .game-control-row {
            background: #1f293d;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            font-size: 11px;
            border-left: 3px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ctrl-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            background: #e67e22;
            color: white;
        }
        .ctrl-btn.active-status { background: #27ae60; }
        #adminPanel input {
            width: 90%;
            padding: 6px;
            margin: 5px 0;
            background: #1f293d;
            border: 1px solid #4b5563;
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }
        .ban-submit {
            background: #e74c3c;
            color: white;
            border: none;
            width: 100%;
            padding: 6px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
        .ban-submit:hover { background: #c0392b; }

        /* Main Area */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            position: relative;
            padding: 20px;
        }

        /* Home View Grid of Game Cards */
        #homeView {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
            overflow-y: auto;
        }
        .games-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 850px;
        }
        .game-card {
            background: #1f293d;
            border: 2px solid #374151;
            width: 190px;
            height: 150px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            padding: 10px;
            position: relative;
        }
        .game-card:hover {
            border-color: #27ae60;
            transform: scale(1.05);
            background: #25334d;
        }
        .game-card.locked {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }
        .game-card.locked .lock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 11px;
            background: #c0392b;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
        }

        /* Play View Container */
        #playView {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .back-btn {
            align-self: flex-start;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .back-btn:hover { background: #c0392b; }
        
        iframe {
            width: 100%;
            height: 85%;
            border: 2px solid #374151;
            border-radius: 10px;
            background: #000;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">🎮 DEEK ARCADE</div>
        
        <div class="nav-section">Navigation</div>
        <button class="nav-btn active" onclick="showHome()">🏠 Home</button>

        <div class="nav-section">Hot Games</div>
        <div id="sidebarGameList"></div>

        <!-- Secret Admin & Ban Control Panel -->
        <div id="adminPanel">
            <div style="font-size: 11px; color: #e74c3c; font-weight: bold; margin-bottom: 6px;">🚫 ADMIN BAN CENTER</div>
            <input type="text" id="banUsername" placeholder="Enter Username to Ban">
            <button class="ban-submit" onclick="banPlayer()">Ban User</button>
            
            <div style="font-size: 11px; color: #3498db; font-weight: bold; margin-top: 14px; margin-bottom: 6px;">🔒 Game Lock Controls</div>
            <div id="adminGameControlsList"></div>
        </div>
    </div>

    <!-- Main View Area -->
    <div class="main">
        
        <!-- Home View Grid of Game Cards -->
        <div id="homeView">
            <h1 style="color: #f39c12; margin-bottom: 30px;">🔥 Select a Game to Play</h1>
            <div class="games-grid" id="homeGrid"></div>
        </div>

        <!-- Active Game Play View -->
        <div id="playView">
            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                <button class="back-btn" onclick="showHome()">⬅ Back to Home</button>
                <h2 id="gameTitle" style="margin: 0 0 15px 0; color: #2ecc71;">Game Title</h2>
                <div style="width: 100px;"></div>
            </div>
            <iframe id="gameFrame" src=""></iframe>
        </div>

    </div>

    <script>
        let games = [
            { title: "Space Waves", url: "https://www.crazygames.com/embed/space-waves", icon: "🌌", active: true },
            { title: "Lucky Block", url: "https://playgama.com/game/kick-lucky-blocks-online?utm_source=bing&utm_medium=cpc&utm_campaign=Bing_DSA-category_T1_eng_Desktop_General&utm_campaign_id=523447623&utm_adgroup=game&utm_adgroup_id=1319416968654326&utm_term=game&utm_content=cid-523447623|gid-1319416968654326|aid-82463811984225|net-o|dvc-c&utm_target=dat-2334263187200558:loc-9&utm_network=o&utm_device=c&msclkid=262b719a3c7a11f980611b06872b5f95", icon: "🎁", active: true },
            { title: "Steal Brainrots", url: "https://duckmath.org/class/steal-brainrots-multiplayer", icon: "🐍", active: true },
            { title: "Emperors on Ice", url: "https://html5.gamedistribution.com/12d36b63ef9641e685adc28bd3e28999/", icon: "🐧", active: true },
            { title: "Micro Pilots", url: "https://html5.gamedistribution.com/2c28e9be86334bc7b1299a1a18a3f8e9/", icon: "🚁", active: true },
            { title: "Panda Block", url: "https://www.bubbleshooter.net/games/panda-block/", icon: "🐼", active: true }
        ];

        let bannedUsers = [];

        function renderArcade() {
            let sidebar = document.getElementById("sidebarGameList");
            let grid = document.getElementById("homeGrid");
            let controlsList = document.getElementById("adminGameControlsList");

            sidebar.innerHTML = "";
            grid.innerHTML = "";
            controlsList.innerHTML = "";

            games.forEach((game, index) => {
                if (game.active) {
                    let sideBtn = document.createElement("button");
                    sideBtn.className = "nav-btn";
                    sideBtn.setAttribute("onclick", `openGame(${index})`);
                    sideBtn.innerHTML = `<span>${game.icon} ${game.title}</span>`;
                    sidebar.appendChild(sideBtn);
                }

                let card = document.createElement("div");
                card.className = "game-card" + (game.active ? "" : " locked");
                card.style.pointerEvents = game.active ? "auto" : "none";
                if (game.active) {
                    card.setAttribute("onclick", `openGame(${index})`);
                } else {
                    card.removeAttribute("onclick");
                }
                card.innerHTML = `
                    <span style="font-size: 35px;">${game.icon}</span>
                    <h4 style="margin: 10px 0 0 0;">${game.title}</h4>
                    ${!game.active ? '<span class="lock-badge">LOCKED</span>' : ''}
                `;
                grid.appendChild(card);

                let ctrlRow = document.createElement("div");
                ctrlRow.className = "game-control-row";
                ctrlRow.innerHTML = `
                    <span>${game.icon} ${game.title}</span>
                    <button class="ctrl-btn ${game.active ? 'active-status' : ''}" onclick="toggleGameStatus(${index})">
                        ${game.active ? '🔓 Unlocked' : '🔒 Locked'}
                    </button>
                `;
                controlsList.appendChild(ctrlRow);
            });
        }

        renderArcade();

        window.addEventListener("keydown", function(e) {
            if (e.key === "`") {
                let password = prompt("Enter Admin Secret Code:");
                if (password === "admin123") {
                    let panel = document.getElementById("adminPanel");
                    panel.style.display = panel.style.display === "block" ? "none" : "block";
                } else if (password !== null) {
                    alert("Incorrect Code!");
                }
            }
        });

        function banPlayer() {
            let username = document.getElementById("banUsername").value.trim();
            if (!username) {
                alert("Please enter a username to ban!");
                return;
            }

            bannedUsers.push(username.toLowerCase());
            document.getElementById("banUsername").value = "";
            alert(`🚫 User "${username}" has been successfully banned from the arcade!`);
        }

        function toggleGameStatus(index) {
            games[index].active = !games[index].active;
            renderArcade();
        }

        function openGame(arg1, arg2) {
            if (typeof arg1 === 'number') {
                let game = games[arg1];
                if (!game || !game.active) {
                    alert("🔒 This game is currently locked!");
                    return;
                }
                document.getElementById("homeView").style.display = "none";
                document.getElementById("playView").style.display = "flex";
                document.getElementById("gameTitle").innerText = game.title;
                document.getElementById("gameFrame").src = game.url;
                return;
            }

            document.getElementById("homeView").style.display = "none";
            document.getElementById("playView").style.display = "flex";
            document.getElementById("gameTitle").innerText = arg1;
            document.getElementById("gameFrame").src = arg2;
        }

        function showHome() {
            document.getElementById("playView").style.display = "none";
            document.getElementById("homeView").style.display = "flex";
            document.getElementById("gameFrame").src = ""; 
        }
    </script>

</body>
</html>
